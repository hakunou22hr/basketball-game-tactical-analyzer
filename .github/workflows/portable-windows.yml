name: Build Windows Portable Analyzer

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "local-ai-server/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "PORTABLE_WINDOWS_SETUP.md"
      - ".github/workflows/portable-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm run test

      - name: Build app
        run: npm run build

      - name: Assemble portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $PWD "portable-package"
          New-Item -ItemType Directory -Force $out | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $out "local-ai-server") | Out-Null

          $node = (Get-Command node).Source
          Copy-Item $node (Join-Path $out "node.exe")
          Copy-Item "local-ai-server\server.mjs" (Join-Path $out "local-ai-server\server.mjs")
          Copy-Item "local-ai-server\.env.example" (Join-Path $out "local-ai-server\.env.example")
          Copy-Item "local-ai-server\START-AI-SERVER-PORTABLE.bat" (Join-Path $out "START-AI-SERVER.bat")
          Copy-Item "PORTABLE_WINDOWS_SETUP.md" (Join-Path $out "PORTABLE_WINDOWS_SETUP.md")
          Copy-Item "dist" (Join-Path $out "dist") -Recurse

          $readme = @(
            "Basketball Tactical Analyzer - Portable Windows",
            "=================================================",
            "1. Double-click START-AI-SERVER.bat",
            "2. On first run, Notepad opens the settings file.",
            "3. Enter your OpenAI API key after OPENAI_API_KEY= and save.",
            "4. Double-click START-AI-SERVER.bat again.",
            "5. Open http://localhost:8787 in your browser.",
            "",
            "Node.js installation is not required."
          )
          $readme | Set-Content -Encoding UTF8 (Join-Path $out "README-FIRST.txt")

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "portable-package\*" -DestinationPath "Basketball-Tactical-Analyzer-Portable.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Basketball-Tactical-Analyzer-Portable
          path: Basketball-Tactical-Analyzer-Portable.zip
          if-no-files-found: error
          retention-days: 30
